[versions]
# 工具链(2026-10-28 核实:AGP 9.4.1 需 Gradle ≥9.6;本仓 Gradle 9.8.2)
agp = "9.4.1"
kotlin = "2.4.20"
gradleWrapper = "9.8.2"

composeBom = "2026.08.00"
activityCompose = "1.13.0"
# 系统冷启动窗口:1.2.0 为 Google Maven 当前稳定线(2026-11-04 实查 maven-metadata.xml)
coreSplashscreen = "1.2.0"

# 网络基础块(2026-10-30 核实):OkHttp 5.5.1 稳定(2026-10-22,含证书安全修复);serialization-json 1.12.0(2026-10-19)
okhttp = "5.5.1"
kotlinxSerializationJson = "1.12.0"

# 静态检查接入(2026-10-30 实查 Maven Central / Plugin Portal 元数据)
# ktlint-gradle 14.2.0 = portal latest;其内置引擎版本由插件的 ktlint.version 单独钉(根 build.gradle.kts)
ktlintGradle = "14.2.0"
ktlintEngine = "1.8.0"
# detekt 稳定线停在 1.23.8(2025-02-21);Central 上并无 2.x alpha,旧记录的"备选 alpha.6"不存在
detekt = "1.23.8"

# 业务依赖(2026-10-30 逐项实查 dl.google.com / repo1.maven.org 的 maven-metadata.xml,滤掉 alpha/beta/rc)
# ksp:KSP 自 2.3.0 起改成扁平版本线,不再有 "2.4.20-1.0.x" 这种形态 —— 旧 TODO 里"等对应 Kotlin 的稳定版"这个前提不成立。
#   实测结论(仓库外最小工程跑通,非推断):ksp 2.3.12 + kotlin 2.4.20 下处理器能正常解析 2.4.20 编译的声明,apiVersion 报 2.4.0。
#   风险仍记在案:KSP 官方只保证 2.3.x,Room/Hilt 的处理器是否接受 2.4.20 要靠真模块编译验,不靠推理。
ksp = "2.3.12"
hilt = "2.60.1"
# androidx.hilt 这条发布线与 hilt(Dagger)是两个 groupId、两套版本号;按 Google Maven 元数据实查的稳定线取。
# 1.4.0 把 compose 里的 hiltViewModel 从 hilt-navigation-compose 搬进了 hilt-lifecycle-viewmodel-compose
hiltCompose = "1.4.0"
# 协程稳定线(Central 实查:1.10.0/1.10.1/1.10.2/1.11.0):DataStore 的 Flow 签名、Hilt 的 suspend 注入都靠它
coroutines = "1.11.0"
room = "2.8.5"
datastore = "1.3.0"
navigation = "2.10.2"
retrofit = "3.0.0"
coil3 = "3.6.3"
# media3 稳定线是 1.11.1(1.9.x 已过时:1.9.4 → 1.10.1 → 1.11.1);1.11.1 的 AAR 要求 minCompileSdk 36,本仓 37 满足
media3 = "1.11.1"
timber = "5.0.1"
work = "2.12.0"
# lifecycle 2.12.x 只有 alpha,稳定线停在 2.11.0(Google 的 <latest> 会把 alpha05 报成最新,别照抄)
lifecycle = "2.11.0"

# composeBom 2026.09.00 已发布,本仓暂不跟版:换 BOM 等于在功能开发中途扳 Compose API 面,
# 下一次核对放在版本收口时统一做(2026-10-30 记)

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }

# 网络基础块:core:network 骨架
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-coroutines = { group = "com.squareup.okhttp3", name = "okhttp-coroutines", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# 协程(2026-10-30 实查 Central:-core / -android 两条稳定线同为 1.11.0)
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# DI 与代码生成
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hiltCompose" }

# 持久化
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
# room-ktx 不再登记:2.7 起它的 API 已并进 room-runtime,再引只是多拖一份旧的 coroutines 约束(2026-10-30 核 pom)
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# 导航 / 生命周期 / 图片 / 播放 / 网络装配
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
coil-bom = { group = "io.coil-kt.coil3", name = "coil-bom", version.ref = "coil3" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-dash = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
# 直播走 HLS:media3 把 HLS 源拆成独立产物,不接就没有 m3u8
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
# DASH 分轨的取流面(ProgressiveMediaSource 用的 DataSource 栈)在独立产物里,不靠 exoplayer 的传递依赖
media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
# Retrofit 3 的 kotlinx-serialization 转换器就叫这个名字;带 -coroutines 的那个后缀产物不存在(已探 404)
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# AGP 9 起内置 Kotlin 支持,不再声明 org.jetbrains.kotlin.android(2026-10-30 迁移)
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
# 代码生成两件套:Room/Hilt 都走 KSP(AGP 9 内置 Kotlin,不需要再声明 kotlin-android 插件)
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
